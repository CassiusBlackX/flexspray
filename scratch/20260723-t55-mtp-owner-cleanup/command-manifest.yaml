{
  "schema_version": 2,
  "experiment_id": "t55-mtp-owner-cleanup",
  "control_revision": "e3682e593c144ab441dd7045aff5f6312efab86d",
  "treatment_revision": "5965931f378430f3d4195ec7fab5487a4e01ce1d",
  "run_order": ["t55-before", "t55-after"],
  "runtime": {
    "mtp_threads": 16,
    "rng_run": 1,
    "dependency_visibility_delay": "10ns",
    "initial_task_start_offset_window": "32ps",
    "timing_offset_seed": 1
  },
  "guards": {
    "rss_limit_bytes": 2147483648,
    "wall_limit_seconds": 120,
    "sample_interval_seconds": 0.25
  },
  "execution": {
    "serial": true,
    "repetitions": 1,
    "checkpoint_policy": "continue_full_matrix",
    "manual_approval_gate": false,
    "overwrite_policy": "refuse_existing_results_root",
    "failure_behavior": "fail_closed_stop_before_next_run"
  },
  "canonical_policy": "normalized_rank_bytes_must_match_exactly",
  "snapshot_policy": "treatment_only",
  "artifact_contract": [
    "command.json", "manifest.json", "exit-code.txt", "time-l.txt",
    "rss-samples.csv", "stdout.txt", "stderr.txt", "canonical-output.csv"
  ],
  "commands": [
    {
      "id": "generate-before", "case_id": "t55-before", "phase": "generate",
      "command": ["uv", "run", "--isolated", "--with-requirements", "scratch/ns-3-ub-tools/requirements.txt", "python", "{package}/scripts/generate_case.py", "{package}/cases/t55-before/input"],
      "cwd": "{treatment_worktree}", "output_dir": "{package}/cases/t55-before/input",
      "expected_artifacts": ["node.csv", "topology.csv", "routing_table.csv", "traffic.csv", "network_attribute.txt"]
    },
    {
      "id": "generate-after", "case_id": "t55-after", "phase": "generate",
      "command": ["uv", "run", "--isolated", "--with-requirements", "scratch/ns-3-ub-tools/requirements.txt", "python", "{package}/scripts/generate_case.py", "{package}/cases/t55-after/input"],
      "cwd": "{treatment_worktree}", "output_dir": "{package}/cases/t55-after/input",
      "expected_artifacts": ["node.csv", "topology.csv", "routing_table.csv", "traffic.csv", "network_attribute.txt"]
    },
    {
      "id": "build-before", "case_id": "t55-before", "phase": "build",
      "command": ["python3.12", "./ns3", "build", "-j8", "ub-quick-example"],
      "cwd": "{control_worktree}", "output_dir": "{control_worktree}/build/scratch/ns3.44-ub-quick-example",
      "expected_artifacts": ["binary", "unified_bus_library", "mtp_library", "cmake_cache"]
    },
    {
      "id": "build-after", "case_id": "t55-after", "phase": "build",
      "command": ["python3.12", "./ns3", "build", "-j8", "ub-quick-example"],
      "cwd": "{treatment_worktree}", "output_dir": "{treatment_worktree}/build/scratch/ns3.44-ub-quick-example",
      "expected_artifacts": ["binary", "unified_bus_library", "mtp_library", "cmake_cache"]
    },
    {
      "id": "validate", "case_id": "experiment-group", "phase": "validate",
      "command": ["python3.12", "{package}/scripts/run_t55.py", "--validate-only", "--before-worktree", "{control_worktree}", "--after-worktree", "{treatment_worktree}"],
      "cwd": "{treatment_worktree}", "output_dir": "stdout",
      "expected_artifacts": ["validated package", "validated inputs", "validated provenance"]
    },
    {
      "id": "run-before", "case_id": "t55-before", "phase": "run",
      "command": ["/usr/bin/time", "-l", "-o", "{run_dir}/time-l.txt", "{binary}", "--case-path={run_dir}/case", "--rng-run=1", "--dependency-visibility-delay=10ns", "--initial-task-start-offset-window=32ps", "--timing-offset-seed=1", "--canonical-output={run_dir}/canonical", "--mtp-threads=16"],
      "cwd": "{control_worktree}", "output_dir": "{run_dir}",
      "expected_artifacts": ["command.json", "manifest.json", "exit-code.txt", "time-l.txt", "rss-samples.csv", "stdout.txt", "stderr.txt", "canonical-output.csv"]
    },
    {
      "id": "run-after", "case_id": "t55-after", "phase": "run",
      "command": ["/usr/bin/time", "-l", "-o", "{run_dir}/time-l.txt", "{binary}", "--case-path={run_dir}/case", "--rng-run=1", "--dependency-visibility-delay=10ns", "--initial-task-start-offset-window=32ps", "--timing-offset-seed=1", "--canonical-output={run_dir}/canonical", "--runtime-storage-snapshot={run_dir}/runtime-storage-snapshot.csv", "--mtp-threads=16"],
      "cwd": "{treatment_worktree}", "output_dir": "{run_dir}",
      "expected_artifacts": ["command.json", "manifest.json", "exit-code.txt", "time-l.txt", "rss-samples.csv", "stdout.txt", "stderr.txt", "canonical-output.csv", "runtime-storage-snapshot.csv"]
    },
    {
      "id": "analyze", "case_id": "experiment-group", "phase": "analyze",
      "command": ["python3.12", "{package}/scripts/analyze_t55.py", "--regenerate-derived"],
      "cwd": "{treatment_worktree}", "output_dir": "{package}",
      "expected_artifacts": ["comparison-summary.json", "analysis.md", "derived-regeneration-provenance.json"]
    }
  ]
}
