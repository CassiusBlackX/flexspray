schema_version: 1
package_root: scratch/20260720-ctp-fastpath-memory-scaling
commands:
  prepare_next_role:
    - test -n "$T36_NEXT_ROOT"
    - test "$(git -C "$T36_NEXT_ROOT" rev-parse HEAD)" = cf8ee683e00e5b6210661013e93cec7217d662e5
    - cd "$T36_NEXT_ROOT" && python3.12 ./ns3 configure --enable-modules=unified-bus --disable-examples --enable-tests --disable-mpi --disable-mtp --disable-werror -d release -G Ninja
    - cd "$T36_NEXT_ROOT" && python3.12 ./ns3 build -j 2 ub-quick-example
  prepare_lazy_role:
    - git worktree add --detach .worktrees/t36-lazy-baseline a95f8bc
    - cd .worktrees/t36-lazy-baseline && python3.12 ./ns3 configure --enable-modules=unified-bus --disable-examples --enable-tests --disable-mpi --disable-mtp --disable-werror -d release -G Ninja
    - cd .worktrees/t36-lazy-baseline && python3.12 ./ns3 build -j 2 ub-quick-example
  materialize:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py materialize --next-root "$T36_NEXT_ROOT"
  correctness:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py correctness --next-root "$T36_NEXT_ROOT"
  queue_retirement_ablation:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py queue-retirement-ablation --next-root "$T36_NEXT_ROOT"
  stable_queue_validation:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py stable-queue-validation --next-root "$T36_NEXT_ROOT"
  stable_queue_complex_validation:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py stable-queue-complex-validation --next-root "$T36_NEXT_ROOT"
  stable_queue_performance:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py stable-queue-performance --cases scale-2g --next-root "$T36_NEXT_ROOT"
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py stable-queue-performance --cases scale-8g --pairs 3 --next-root "$T36_NEXT_ROOT"
  compact_history_validation:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py compact-history-validation --next-root "$T36_NEXT_ROOT"
  compact_history_frozen_validation:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py compact-history-frozen-validation --next-root "$T36_NEXT_ROOT"
  compact_history_performance:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py compact-history-performance --cases scale-512m --pairs 1 --next-root "$T36_NEXT_ROOT"
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py compact-history-performance --cases scale-2g --next-root "$T36_NEXT_ROOT"
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py compact-history-performance --cases scale-8g --pairs 3 --next-root "$T36_NEXT_ROOT"
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py compact-history-performance --cases scale-8g --pairs 5 --result-id performance-compact-history-8g-v2 --next-root "$T36_NEXT_ROOT"
  performance:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py performance --next-root "$T36_NEXT_ROOT"
  analyze:
    - python3.12 scratch/20260720-ctp-fastpath-memory-scaling/scripts/run_experiment.py analyze --next-root "$T36_NEXT_ROOT"
execution:
  order: strictly serial
  overwrite_policy: refuse completed run directories; resume exact result.json files
  timeout_policy: block-specific hard timeout with process-group termination
  output_root: scratch/20260720-ctp-fastpath-memory-scaling/results
